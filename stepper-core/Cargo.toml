[package]
name = "stepper-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# The SML front end is millet's (https://github.com/azdavis/millet), an SML
# language server: `sml-lex` and `sml-parse` produce a full-SML concrete syntax
# tree, which `frontend/lower.rs` lowers into this crate's AST. Pinned by rev
# because these crates are `publish = false` and make no stability promise.
[dependencies.sml-lex]
git = "https://github.com/azdavis/millet.git"
rev = "4df3186429d1f7822d66a44114eac973f4e1e6df"

[dependencies.sml-parse]
git = "https://github.com/azdavis/millet.git"
rev = "4df3186429d1f7822d66a44114eac973f4e1e6df"

[dependencies.sml-syntax]
git = "https://github.com/azdavis/millet.git"
rev = "4df3186429d1f7822d66a44114eac973f4e1e6df"

[dependencies.sml-fixity]
git = "https://github.com/azdavis/millet.git"
rev = "4df3186429d1f7822d66a44114eac973f4e1e6df"

# Millet's own lexer helpers, for the one thing a token's text doesn't say
# outright: what a string literal's escapes stand for. Reusing the lexer's
# implementation is what keeps `\ddd`, `\^c` and line continuations meaning in
# `lower.rs` exactly what they meant to the lexer that accepted the token.
[dependencies.lex-util]
git = "https://github.com/azdavis/millet.git"
rev = "4df3186429d1f7822d66a44114eac973f4e1e6df"

# Only the browser build needs the DOM bindings. Keeping them off the native
# target is what keeps `cargo test` — the fast loop for interpreter work — from
# compiling and linking any of this.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "DomTokenList",
    "Element",
    "Node",
    "NodeList",
    "Text",
    "Window",
]
